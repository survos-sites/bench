# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # ES owns automatic indexing on this branch. Meili remains an explicit comparison path.
    Survos\MeiliBundle\EventListener\DoctrineEventListener:
        autowire: true
        autoconfigure: true
        calls:
            - [disable, []]
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # --- api-platform/meilisearch proof of concept ---
    # The client/providers/extensions themselves are wired by the api_platform.meilisearch
    # bundle config (config/packages/api_platform.yaml) now that this app runs the fork's
    # 5.0-alpha line. Only the two concrete, resource-scoped filter instances need
    # declaring here, extending the bundle's abstract parents (same pattern as
    # api-platform/elasticsearch's documented MatchFilter/TermFilter usage).
    movie.meili_search_filter:
        parent: 'api_platform.meilisearch.search_filter'
        arguments: [['title']]
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false

    # Must match Movie::FILTERABLE_FIELDS (the index's filterableAttributes) -- Meilisearch
    # 400s on a filter targeting an undeclared attribute.
    movie.meili_term_filter:
        parent: 'api_platform.meilisearch.term_filter'
        arguments: [['tags', 'genres', 'actors', 'characters', 'year', 'votes', 'budget']]
        tags: ['api_platform.filter']
        autowire: false
        autoconfigure: false

    # NOTE: FacetsFieldSearchFilter (survos/meili-bundle) stays on the deprecated
    # #[ApiFilter] attribute for now, not QueryParameter -- migrating it silently
    # broke filtering (wired correctly by every check, but never actually applied
    # a WHERE clause; root cause not confirmed, tracked as a follow-up issue).
    # FacetsFieldSearchFilter extends AbstractFilter, itself @deprecated since 4.4
    # and removed in 6.0, so a real fix means implementing FilterInterface
    # directly, not just swapping the attribute syntax.

    Aws\S3\S3Client:
        arguments:
            -
                version: '2006-03-01'
                region: 'us-east-1'
                credentials:
                    key: '%env(AWS_S3_ACCESS_ID)%'
                    secret: '%env(AWS_S3_ACCESS_SECRET)%'
