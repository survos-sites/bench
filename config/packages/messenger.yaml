framework:
    messenger:
        failure_transport: failed

        transports:
#            _base_rabbitmq: &base_rabbitmq
#                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
##                serializer: messenger.transport.symfony_serializer
#                retry_strategy:
#                    max_retries: 3
#                    multiplier: 2
#
#            official_fetch_wiki:
#                <<: *base_rabbitmq
#                options:
#                    queues:
#                        official_fetch_wiki: ~
#

            # https://symfony.com/doc/current/messenger.html#transport-configuration
#            official_fetch_wiki:
#                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
            # Its own queue so a full reindex can be consumed and stopped by its own worker,
            # with retries suited to ES answering 429 when its write queue saturates.
            elastic:
                # Same DB connection: jobs inside an outer transaction become visible on commit.
                dsn: 'doctrine://default'
                options:
                    queue_name: elastic
                retry_strategy:
                    max_retries: 3
                    multiplier: 2

#                options:
#                    queues:
#                        async: ~
# these are doctrine only
#                options:
#                    use_notify: true
#                    check_delayed_interval: 60000
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
#            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
#            Symfony\Component\Notifier\Message\ChatMessage: async
#            Symfony\Component\Notifier\Message\SmsMessage: async
            Survos\ElasticBundle\Message\ReindexDocuments: elastic
            Survos\ElasticBundle\Message\RemoveDocuments: elastic

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
